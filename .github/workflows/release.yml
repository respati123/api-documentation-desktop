name: Release desktop app

# Runs when a tag vX.Y.Z is pushed on a commit in main. The tag is the version: it is set in package.json
# for the build and is not committed back. Runs the checks, builds all three platforms, and attaches the
# installers to a DRAFT GitHub release. Publishing the draft is a manual step in the GitHub UI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read the version from the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v0.1.5, got: $TAG"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG is not on main."; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run i18n-check
      - run: bun run test

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
            path: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-latest
            script: dist:mac
            artifact: macos
            path: |
              release/*.dmg
              release/*.pkg
          - os: windows-latest
            script: dist:win
            artifact: windows
            path: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      # They are baked into the build, so set them to the production URLs.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CLOUD_URL: ${{ vars.VITE_CLOUD_URL }}
      # Unsigned builds: stop electron-builder from looking for a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Set the version from the tag
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: bun run ${{ matrix.script }} --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      # A re-run finds the draft an earlier attempt left and replaces its files. --clobber deletes before it uploads,
      # so a published release is refused.
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if is_draft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft); then
            if [ "$is_draft" != "true" ]; then
              echo "$TAG is already published. Its installers are left as they are."; exit 1
            fi
            gh release upload "$TAG" installers/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" installers/* \
              --repo "$REPO" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi
