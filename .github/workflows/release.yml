name: Release desktop app

# Runs on every push to main (patch bump) and on manual dispatch (choose the bump).
# Each run bumps the version, tags it, builds all three platforms, and attaches the
# installers to a DRAFT GitHub release. Publishing the draft is a manual step in the
# GitHub UI.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Commits whose message contains [skip release] do not create a release.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Bump version, commit, and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump || 'patch' }}" --no-git-tag-version >/dev/null
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "Release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
            path: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-latest
            script: dist:mac
            artifact: macos
            path: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
          - os: windows-latest
            script: dist:win
            artifact: windows
            path: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    env:
      # Repository variables (Settings > Secrets and variables > Actions > Variables).
      # They are baked into the build, so set them to the production URLs.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CLOUD_URL: ${{ vars.VITE_CLOUD_URL }}
      # Unsigned builds: stop electron-builder from looking for a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  draft-release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" installers/* \
            --repo "${{ github.repository }}" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "v${{ needs.version.outputs.version }}" \
            --generate-notes \
            --draft
